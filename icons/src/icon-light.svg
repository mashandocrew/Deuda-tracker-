<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    COLORS — all extracted from index.html ThemeContext (lines 508-514):
      lightTheme.accent:   #7C3AED  (violet, primary accent)
      lightTheme.bg:       #f5f5f5  (base — icon uses darker violet derived from accent)
      lightTheme.surface:  #ffffff  (glass layers)
      lightTheme.success:  #16a34a  (green — exact value used for ring)
      ring gradient hi:    #4ade80  (lighter green, derived — same hue as #16a34a, higher L)
      ring gradient dark:  #14532d  (darker green, same hue, lower L)
  -->
  <defs>
    <!-- BACKGROUND: derived from lightTheme.accent #7C3AED, darkened for depth -->
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#1e0a4e"/>
      <stop offset="55%"  stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- FROSTED ATMOSPHERE — lightTheme.surface #ffffff derived -->
    <radialGradient id="atmos" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#ffffff"  stop-opacity="0.28"/>
      <stop offset="65%"  stop-color="#ddd6fe"  stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED"  stop-opacity="0"/>
    </radialGradient>

    <!-- RING 3D GRADIENT — top-lit, gradientUnits=userSpaceOnUse maps Y to canvas coords
         lightTheme.success #16a34a is the canonical value; hi/low derived same hue -->
    <linearGradient id="ringGrad" x1="512" y1="185" x2="512" y2="840"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="35%"  stop-color="#22c55e"/>
      <stop offset="68%"  stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- GLASS DISK FILL -->
    <radialGradient id="diskFill" cx="50%" cy="33%" r="72%">
      <stop offset="0%"   stop-color="#ffffff"  stop-opacity="0.32"/>
      <stop offset="65%"  stop-color="#ede9fe"  stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C3AED"  stop-opacity="0.05"/>
    </radialGradient>

    <!-- SPECULAR TOP ARC -->
    <linearGradient id="specTop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.44"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- BOTTOM DEPTH SHADOW -->
    <radialGradient id="botShadow" cx="50%" cy="100%" r="65%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- BORDER GRADIENT -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"  stop-opacity="0.58"/>
      <stop offset="50%"  stop-color="#a78bfa"  stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED"  stop-opacity="0.06"/>
    </linearGradient>

    <!-- TEXT FILL: engraved glass — light violet-white, using lightTheme.accent derivatives -->
    <linearGradient id="textFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0ebff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="blur20" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="ringGlow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glint" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="sq"><rect width="1024" height="1024"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <!-- 1. Background fill -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- 2. Frosted glass atmosphere -->
    <ellipse cx="512" cy="468" rx="430" ry="360"
             fill="url(#atmos)" filter="url(#blur20)"/>

    <!-- 3. Ring track ghost (full circle, lightTheme.success #16a34a very faint) -->
    <circle cx="512" cy="512" r="290"
            fill="none" stroke="#16a34a" stroke-opacity="0.20" stroke-width="72"/>

    <!-- 4. Ring ambient glow shadow (blurred beneath arc for lift/depth) -->
    <path d="M 512 222 A 290 290 0 1 1 277.4 682.5"
          fill="none" stroke="#16a34a" stroke-opacity="0.22"
          stroke-width="108" stroke-linecap="round"
          filter="url(#blur20)"/>

    <!-- 5. Main progress arc ~65% (234° clockwise from 12 o'clock)
         Arc geometry: cx=512 cy=512 r=290
           start  = -90°  → (512, 222)
           sweep  = 234°  → large-arc=1, sweep=1
           end    = 144°  → (277.4, 682.5)
         Gradient: lighter green at top (y≈185) → dark green at bottom (y≈840)
         lightTheme.success #16a34a is the mid reference -->
    <path d="M 512 222 A 290 290 0 1 1 277.4 682.5"
          fill="none" stroke="url(#ringGrad)"
          stroke-width="72" stroke-linecap="round"
          filter="url(#ringGlow)"/>

    <!-- 6. Inner highlight arc — lit inner rim of 3D tube
         r=272 (inner edge of stroke at 290-18); same start/end angles
           start -90° → (512, 240)
           end   144° → (292.0, 671.9) -->
    <path d="M 512 240 A 272 272 0 1 1 292.0 671.9"
          fill="none" stroke="#ffffff" stroke-opacity="0.28"
          stroke-width="22" stroke-linecap="round"/>

    <!-- 7. Glint 1 — 20° from arc start, angle -70°
         x = 512 + 290*cos(-70°) = 611  y = 512 + 290*sin(-70°) = 240 -->
    <circle cx="611" cy="240" r="22" fill="#ffffff" opacity="0.88" filter="url(#glint)"/>
    <circle cx="611" cy="240" r="8"  fill="#ffffff" opacity="1.0"/>

    <!-- 8. Glint 2 — 90° from arc start, angle 0° (rightmost point)
         x = 802  y = 512 -->
    <circle cx="800" cy="512" r="17" fill="#ffffff" opacity="0.78" filter="url(#glint)"/>
    <circle cx="800" cy="512" r="6"  fill="#ffffff" opacity="0.95"/>

    <!-- 9. Glint 3 — 185° from arc start, angle 95°
         x = 512 + 290*cos(95°) = 487  y = 512 + 290*sin(95°) = 801 -->
    <circle cx="487" cy="799" r="13" fill="#ffffff" opacity="0.65" filter="url(#glint)"/>
    <circle cx="487" cy="799" r="5"  fill="#ffffff" opacity="0.85"/>

    <!-- 10. Center glass disk (frosted, lightTheme.surface #ffffff derived) -->
    <circle cx="512" cy="512" r="210"
            fill="url(#diskFill)"
            stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- 11. "D.T" monogram — engraved glass effect (3 layers: shadow→main→highlight)
         Light source: upper-left; shadow offset +3/+3, highlight offset -3/-3
         textFill gradient: light violet-white derived from lightTheme.accent #7C3AED -->
    <!-- Shadow layer -->
    <text x="515" y="515"
          font-family="Arial, 'Helvetica Neue', sans-serif"
          font-weight="900" font-size="188"
          fill="#1e0a4e" fill-opacity="0.52"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="-1">D.T</text>
    <!-- Main text -->
    <text x="512" y="512"
          font-family="Arial, 'Helvetica Neue', sans-serif"
          font-weight="900" font-size="188"
          fill="url(#textFill)" fill-opacity="0.93"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="-1">D.T</text>
    <!-- Highlight layer -->
    <text x="509" y="509"
          font-family="Arial, 'Helvetica Neue', sans-serif"
          font-weight="900" font-size="188"
          fill="#ffffff" fill-opacity="0.33"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="-1">D.T</text>

    <!-- 12. Specular highlight at top (Liquid Glass lens effect) -->
    <ellipse cx="512" cy="330" rx="430" ry="270"
             fill="url(#specTop)" filter="url(#blur20)"/>
    <!-- Thin bright specular line at top edge -->
    <path d="M 155 188 Q 512 118 869 188"
          fill="none" stroke="#ffffff" stroke-width="2.5"
          stroke-linecap="round" opacity="0.44"/>

    <!-- 13. Bottom inner depth shadow -->
    <rect width="1024" height="1024" fill="url(#botShadow)"/>

    <!-- 14. Border: glow pass + crisp pass -->
    <rect x="2" y="2" width="1020" height="1020"
          fill="none" stroke="url(#borderGrad)" stroke-width="6"
          filter="url(#blur8)"/>
    <rect x="2" y="2" width="1020" height="1020"
          fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  </g>
</svg>
